server {
  # Listen for incoming HTTP requests on port 80.
  # Port 80 is the default port for HTTP.
  listen 80;

  # Accept requests for any hostname or domain.
  server_name _;

  # Set the directory where Nginx looks for static frontend files.
  # Our React/Vite build files will be stored in this directory.
  root /usr/share/nginx/html;

  # Tell Nginx to use index.html as the default file.
  index index.html;

  # First, try to find the requested file or directory.
  # If it does not exist, serve index.html instead.
  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    # Forward API requests to the backend container.
    # "server" is the Docker Compose service name,
    # and 5000 is the port where the backend is running.
    proxy_pass http://server:5000;

    # Use HTTP/1.1 when communicating with the backend.
    proxy_http_version 1.1;

    # Forward the original Host header to the backend.
    proxy_set_header Host $host;

    # Forward the client's real IP address to the backend.
    proxy_set_header X-Real-IP $remote_addr;

    # Forward the client's IP through the proxy chain.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Tell the backend whether the original request used HTTP or HTTPS.
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}