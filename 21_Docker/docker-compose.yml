services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  server:
    build:
      context: ./server
    environment:
      PORT: ${SERVER_PORT}
      MONGODB_URI: ${MONGODB_URI}
    depends_on:
      - mongo
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - server
    ports:
      - '${CLIENT_PORT}:${CLIENT_PORT}'

volumes:
  mongo-data:
