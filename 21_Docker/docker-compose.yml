# ===================================
# AFTER MULTI-STAGE IMPLEMENTATION
# ===================================
services:
  # MongoDB database container
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  # Node.js/Express backend container
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: ${SERVER_PORT}
      MONGODB_URI: ${MONGODB_URI}
    depends_on:
      - mongo
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'

  # React frontend served by Nginx
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '${CLIENT_PORT}:80'

# Persistent MongoDB storage
volumes:
  mongo-data:
